name: Web build and smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate Web support files
        run: |
          python3 -m py_compile scripts/*.py
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/verify_port.py

  web-extension:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up pinned build tools
        run: |
          scripts/setup_python_build_env.sh
          scripts/bootstrap_dependencies.sh
          scripts/setup_web_toolchain.sh

      - name: Build Web extension
        env:
          JOBS: 4
        run: scripts/build_web.sh

      - uses: actions/upload-artifact@v7
        with:
          name: web-extension
          path: bin/web/*
          if-no-files-found: error

  web-templates:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Restore matching template cache
        id: template-cache
        uses: actions/cache@v5
        with:
          path: dist/web-export-templates
          key: godot-box3d-web-templates-ubuntu-22.04-${{ hashFiles('dependencies.lock', 'scripts/build_web_templates.sh', 'scripts/setup_web_toolchain.sh') }}

      - name: Install build prerequisites
        if: steps.template-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential git pkg-config

      - name: Set up pinned build tools
        if: steps.template-cache.outputs.cache-hit != 'true'
        run: |
          scripts/setup_python_build_env.sh
          scripts/setup_web_toolchain.sh

      - name: Build dynamic-link Web templates
        if: steps.template-cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: scripts/build_web_templates.sh

      - uses: actions/upload-artifact@v7
        with:
          name: web-templates
          path: dist/web-export-templates/*
          if-no-files-found: error

  web-smoke:
    needs: [web-extension, web-templates]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7-stable
      GODOT_ZIP_NAME: Godot_v4.7-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: web-extension
          path: bin/web

      - uses: actions/download-artifact@v8
        with:
          name: web-templates
          path: dist/web-export-templates

      - name: Install Godot and Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/${GODOT_ZIP_NAME}.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP_NAME}.zip"
          unzip -o "$RUNNER_TEMP/${GODOT_ZIP_NAME}.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${GODOT_ZIP_NAME}"
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium

      - name: Export smoke project
        run: |
          mkdir -p web_smoke_project/addons/godot-box3d/bin/web build/web-smoke
          cp bin/web/*.wasm web_smoke_project/addons/godot-box3d/bin/web/
          "$RUNNER_TEMP/godot/${GODOT_ZIP_NAME}" --headless \
            --recovery-mode \
            --path web_smoke_project \
            --export-release "Web Box3D Smoke" \
            ../build/web-smoke/index.html

      - name: Run Chromium smoke
        run: |
          python3 scripts/run_web_smoke.py \
            --dir build/web-smoke \
            --screenshot build/web-smoke.png

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: web-smoke-result
          path: build/web-smoke.png
          if-no-files-found: warn

  package:
    needs: [web-extension, web-templates, web-smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-extension
          path: bin/web

      - uses: actions/download-artifact@v8
        with:
          name: web-templates
          path: dist/web-export-templates

      - name: Choose package filename
        id: package-name
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            archive="dist/godot-box3d-${GITHUB_REF_NAME}-web.zip"
          else
            archive="dist/godot-box3d-web-release.zip"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Validate and package
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          python3 scripts/verify_port.py --platform web --require-binaries
          python3 scripts/package_addon.py \
            --mode bundle \
            --platform web \
            --web-templates-dir dist/web-export-templates \
            --output "${{ steps.package-name.outputs.archive }}"
          archive="${{ steps.package-name.outputs.archive }}"
          (
            cd "$(dirname "$archive")"
            sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"
          )

      - uses: actions/upload-artifact@v7
        with:
          name: godot-box3d-web-release
          path: |
            ${{ steps.package-name.outputs.archive }}
            ${{ steps.package-name.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Attach persistent assets to the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.package-name.outputs.archive }}" \
            "${{ steps.package-name.outputs.archive }}.sha256" \
            --clobber
