name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmake-generator: Ninja
          - os: windows-latest
            cmake-generator: Ninja
          - os: macos-latest
            cmake-generator: Ninja

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl ninja-build unzip

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Configure
        run: cmake -B build -G "${{ matrix.cmake-generator }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Install Godot (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GODOT_VERSION: 4.7-stable
          GODOT_ARCHIVE: Godot_v4.7-stable_win64.exe.zip
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/${GODOT_ARCHIVE}" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ARCHIVE}"
          unzip -o "$RUNNER_TEMP/${GODOT_ARCHIVE}" -d "$RUNNER_TEMP/godot"

      - name: Run headless tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7-stable_win64.exe
          TEST_SUMMARY: ${{ runner.temp }}/test-summary.md
          BUILD_DIR: ${{ github.workspace }}/build
        run: scripts/run_headless_tests.sh

      - name: Install Godot (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GODOT_VERSION: 4.7-stable
          GODOT_ZIP_NAME: Godot_v4.7-stable_linux.x86_64
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/${GODOT_ZIP_NAME}.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP_NAME}.zip"
          unzip -o "$RUNNER_TEMP/${GODOT_ZIP_NAME}.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${GODOT_ZIP_NAME}"

      - name: Run headless tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7-stable_linux.x86_64
          TEST_SUMMARY: ${{ runner.temp }}/test-summary.md
        run: scripts/run_headless_tests.sh

      - name: Publish test summary
        if: (runner.os == 'Linux' || runner.os == 'Windows') && always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/test-summary.md" ]]; then
            cat "$RUNNER_TEMP/test-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Tests did not run' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-box3d-${{ runner.os }}
          path: bin/

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
        build-type: [Debug, Release]
    env:
      ANDROID_NDK_VERSION: 28.1.13356709
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure Android
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build Android
        run: cmake --build build --parallel 4

      - name: Check Android entry point and 16 KB ELF alignment
        shell: bash
        run: |
          llvm_bin="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for library in bin/android/*.so; do
            "$llvm_bin/llvm-nm" --dynamic --defined-only "$library" | awk '$3 == "godot_box3d_main" { found = 1 } END { exit !found }'
            "$llvm_bin/llvm-readelf" --program-headers --wide "$library"
            while read -r alignment; do
              (( alignment >= 16384 ))
            done < <("$llvm_bin/llvm-readelf" --program-headers --wide "$library" | awk '$1 == "LOAD" { print $NF }')
          done

      - name: Upload Android library
        uses: actions/upload-artifact@v7
        with:
          name: godot-box3d-android-${{ matrix.abi }}-${{ matrix.build-type }}
          path: bin/
          if-no-files-found: error

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Filenames differ per platform, so the three artifacts flatten into one bin/ cleanly.
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: godot-box3d-*
          merge-multiple: true
          path: bin

      - name: Assemble addon
        run: |
          mkdir -p addon/addons/godot-box3d/bin
          cp test_project/addons/godot-box3d/godot-box3d.gdextension addon/addons/godot-box3d/
          cp LICENSE addon/addons/godot-box3d/
          cp bin/libgodot-box3d.so bin/godot-box3d.dll bin/libgodot-box3d.dylib \
            addon/addons/godot-box3d/bin/
          cp -r bin/android addon/addons/godot-box3d/bin/
          cd addon && zip -r ../godot-box3d-${{ github.ref_name }}.zip addons

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: godot-box3d-${{ github.ref_name }}.zip
          generate_release_notes: true
